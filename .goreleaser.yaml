version: 2

project_name: gimme-aws-creds

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gimme-aws-creds
    main: ./cmd/gimme-aws-creds
    binary: gimme-aws-creds
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/virtualmadden/gimme-aws-creds/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: gimme-aws-creds
    repository:
      owner: virtualmadden
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/virtualmadden/gimme-aws-creds
    description: Acquire temporary AWS credentials via AWS SSO
    license: Apache-2.0
    install: |
      bin.install "gimme-aws-creds"
    test: |
      system "#{bin}/gimme-aws-creds", "version"
